
services:
  nginx:
    build: ./requirements/nginx
    image: nginx:v1.0
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: on-failure
    env_file:
      - .env

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:v1.0
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure
    env_file:
      - .env

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:v1.0
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    env_file:
      - .env

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ynini/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ynini/data/wordpress
